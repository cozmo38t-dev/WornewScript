<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="WornewScript logo">
  <title>WornewScript</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="green" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="55%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#22C55E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="256" cy="232" r="190" fill="url(#glow)"/>

  <!-- soft glow under the monogram -->
  <g filter="url(#soft)" opacity="0.55">
    <path d="M86 138 L156 366 L222 214 L286 366 L356 138"
          fill="none" stroke="#3B82F6" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M172 138 L236 366 L300 214 L364 366 L430 138"
          fill="none" stroke="#22C55E" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- W monogram: two interwoven ribbons -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 138 L156 366 L222 214 L286 366 L356 138"
          stroke="url(#blue)" stroke-width="26"/>
    <path d="M172 138 L236 366 L300 214 L364 366 L430 138"
          stroke="url(#green)" stroke-width="26" opacity="0.92"/>
  </g>

  <!-- thin inner highlight -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <path d="M86 138 L156 366 L222 214 L286 366 L356 138"
          stroke="#BFDBFE" stroke-width="4"/>
    <path d="M172 138 L236 366 L300 214 L364 366 L430 138"
          stroke="#BBF7D0" stroke-width="4"/>
  </g>

  <!-- caption -->
  <text x="256" y="438" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, sans-serif"
        font-size="40" font-weight="700" letter-spacing="1.5" fill="#CDD6F4">WornewScript</text>
  <text x="256" y="468" text-anchor="middle" font-family="DejaVu Sans, Segoe UI, sans-serif"
        font-size="16" letter-spacing="4" fill="#89B4FA">LANGUAGE v0.6</text>
</svg>
